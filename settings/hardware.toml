# badcompanyrecomp - hardware / rendering settings
# Battlefield: Bad Company (Title ID: 454107F9, Frostbite 1.0)

gpu_plugin = "xenos"
graphics_backend = "any"
vsync = true

# Internal render scale (1 = native 720p)
resolution_scale = 1
async_shader_compilation = true
native_2x_msaa = false
anisotropic_override = 1

texture_cache_memory_limit_soft = 1024
texture_cache_memory_limit_hard = 4096
clear_memory_page_state = true
readback_memexport = true
readback_memexport_fast = true
readback_resolve = "full"
host_present_from_non_ui_thread = true

window_width = 1920
window_height = 1080
fullscreen = false
monitor = 0
resolution = "1920x1080"

# ROV for Frostbite eDRAM blending / HDR
render_target_path_d3d12 = "rov"
d3d12_readback_resolve = true
gamma_render_target_as_unorm16 = true

# Monitor output curve; 2 restores the SDK's BT.709 TV curve. Restart required.
badco_display_gamma_type = 1

# Disable the engine film-grain pass; false restores the original setting.
badco_disable_film_grain = true

store_shaders = true
present_letterbox = true

d3d12_adapter = -1
d3d12_allow_variable_refresh_rate_and_tearing = true
d3d12_bindless = true
d3d12_break_on_error = false
d3d12_break_on_warning = false
d3d12_debug = false
d3d12_dxbc_disasm = false
d3d12_dxbc_disasm_dxilconv = false
# Restore the SDK's automatic worker count after prolonged startup with 2 workers.
d3d12_pipeline_creation_threads = -1
d3d12_queue_priority = 2
d3d12_submit_on_primary_buffer_end = true
d3d12_tessellation_wireframe = false

render_target_path_vulkan = "fbo"
vulkan_log_debug_messages = false
vulkan_allow_present_mode_immediate = true
vulkan_allow_present_mode_fifo_relaxed = false
vulkan_allow_present_mode_mailbox = false

headless = false
log_level = "info"
gpu_allow_invalid_fetch_constants = true
dev_debug_runtime = false

# Gameplay / Retro physics: authentic 30 FPS
badco_fps_60 = false

# Filesystem: Frostbite dvd-probe check requires write access to GAME:
allow_game_relative_writes = true

badco_shadow_array_fetch_fix = true

badco_shadow_depth_readback_fast = false

badco_hdr_readback_fast = false

badco_performance_diagnostics = false

badco_diagnostic_hotkeys = false

badco_startup_self_tests = false

badco_timing_diagnostics = false

badco_shadow_array_diagnostics = false

badco_shadow_gpu_capture = false

badco_depth_readback_probe = false

badco_output_size_probe = false

badco_shadow_fixed_movement = -1

draw_resolution_scale_x = 1

draw_resolution_scale_y = 1

badco_mnk_frame_sampling = true

badco_mouse_deadzone_compensation = true
